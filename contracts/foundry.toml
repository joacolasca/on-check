[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = []
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# OpenZeppelin y forge-std vienen de npm (pnpm install en la raíz): sin submódulos de git.
remappings = [
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
  "forge-std/=../node_modules/forge-std/src/",
]
allow_paths = ["../node_modules"]
# El script de deploy escribe las direcciones desplegadas en shared/deployments/.
fs_permissions = [{ access = "read-write", path = "../shared/deployments" }]
